name: Bug Report
description: Create a report to help us improve PomoFlow
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: What version of macOS are you running? (e.g. 14.5 Sonoma)
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: PomoFlow Version
      description: What version of PomoFlow are you using? (e.g. 1.0.4)
    validations:
      required: true
